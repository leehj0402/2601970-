<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display block 연습</title>
    <style>
        #box {
            display: block;
        }
    </style>
</head>
<body>
    <p>
        앞 글자
        <span id="box">박스</span>
        뒤 글자
    </p>
</body>
</html>

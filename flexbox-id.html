<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 박스 id 연습</title>
    <style>
      /* CSS: 부모에게 flex 지시 (id는 # 으로 선택) */
      #container {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      /* 박스마다 칸이 보이도록 */
      #container div {
        border: 1px solid;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <!-- HTML: 박스 3개를 감싸는 부모 -->
    <div id="container">
      <div id="box1">박스1</div>
      <div id="box2">박스2</div>
      <div id="box3">박스3</div>
    </div>
  </body>
</html>
